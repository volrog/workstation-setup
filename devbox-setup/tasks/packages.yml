---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed apt packages
  ansible.builtin.apt:
    upgrade: dist
  when: devbox_apt_upgrade

- name: Install base development packages
  ansible.builtin.apt:
    name: "{{ devbox_apt_packages }}"
    state: present
