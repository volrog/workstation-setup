---
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ devbox_docker_packages }}"
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    groups: docker
    append: true

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
