---
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ devbox_docker_packages }}"
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    groups: docker
    append: true
  when: devbox_docker_add_user_to_group

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Install Docker DOCKER-USER firewall script
  ansible.builtin.copy:
    dest: /usr/local/sbin/devbox-docker-user-firewall
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env sh
      set -eu

      IPTABLES=/usr/sbin/iptables
      CHAIN=DOCKER-USER

      "${IPTABLES}" -N "${CHAIN}" 2>/dev/null || true

      add_top_rule() {
        if ! "${IPTABLES}" -C "${CHAIN}" "$@" 2>/dev/null; then
          "${IPTABLES}" -I "${CHAIN}" 1 "$@"
        fi
      }

      add_top_rule -o br+ -j DROP
      add_top_rule -o docker0 -j DROP
      add_top_rule -s 127.0.0.0/8 -o br+ -j RETURN
      add_top_rule -s 127.0.0.0/8 -o docker0 -j RETURN
      add_top_rule -i br+ -j RETURN
      add_top_rule -i docker0 -j RETURN
      add_top_rule -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
  when: devbox_docker_protect_ufw
  notify:
    - Reload systemd
    - Restart Docker UFW protection

- name: Install Docker UFW protection service
  ansible.builtin.copy:
    dest: /etc/systemd/system/devbox-docker-user-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Protect UFW from accidental public Docker port exposure
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/devbox-docker-user-firewall
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: devbox_docker_protect_ufw
  notify:
    - Reload systemd
    - Restart Docker UFW protection

- name: Enable Docker UFW protection service
  ansible.builtin.systemd_service:
    name: devbox-docker-user-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  when: devbox_docker_protect_ufw
