# Terminal, colors, and key protocol
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u

# General
set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -sg escape-time 0
set -g repeat-time 600
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
set -g prefix2 C-ф
bind C-a send-prefix
bind C-ф send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Russian layout aliases
bind к source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Splits (intuitive: | and -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Russian layout aliases
bind с new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Russian layout aliases
bind р select-pane -L
bind о select-pane -D
bind л select-pane -U
bind д select-pane -R

# Window navigation
bind -r p previous-window
bind -r n next-window
bind Tab last-window

# Russian layout aliases
bind -r з previous-window
bind -r т next-window

# Copy mode (vim bindings)
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Russian layout aliases
bind -T copy-mode-vi м send -X begin-selection
bind -T copy-mode-vi н send -X copy-pipe-and-cancel "pbcopy"

# Smart window renaming
# When pane is idle at shell, show the current directory (basename)
# When a command is running, show the command name with smart aliases
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}'

# Terminal title bar sync
# Updates macOS title bar: session › window_name
set -g set-titles on
set -g set-titles-string "#{session_name} › #{window_name}"

# Status bar (theme: gruvbox-dark-soft)
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#32302f,fg=#ebdbb2"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#504945,fg=#fabd2f,bold] #{session_name} #[bg=#32302f,fg=#504945]"

# Right: date | time
set -g status-right-length 80
set -g status-right "#[fg=#504945]#[bg=#504945,fg=#d5c4a1] %a %d %b #[bg=#504945,fg=#d79921]#[bg=#665c54,fg=#fabd2f,bold] %H:%M #[bg=#32302f,fg=#665c54]"

# Window tabs — inactive
set -g window-status-format "#[fg=#32302f]#[bg=#32302f,fg=#928374] #I  #{window_name} #[bg=#32302f,fg=#32302f]"

# Window tabs — active
set -g window-status-current-format "#[fg=#665c54]#[bg=#665c54,fg=#fabd2f,bold] #I  #{window_name} #[bg=#32302f,fg=#665c54]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"

# Message / command bar
set -g message-style "bg=#504945,fg=#fabd2f,bold"
set -g message-command-style "bg=#504945,fg=#fe8019"

# Copy/search mode highlight
set -g mode-style "bg=#504945,fg=#fabd2f"
